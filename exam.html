<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考試模式 - 選擇題練習網頁</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← 返回首頁</a>
        
        <div id="chapterSelection" class="chapter-selection">
            <h2>選擇章節（可多選）</h2>
            <div class="chapter-grid" id="chapterGrid"></div>
        </div>
        
        <div id="questionCountSelection" class="question-count-selection" style="display: none;">
            <h2>選擇題目數量</h2>
            <div class="count-buttons">
                <button class="count-button" onclick="selectQuestionCount(10)">10題</button>
                <button class="count-button" onclick="selectQuestionCount(20)">20題</button>
                <button class="count-button" onclick="selectQuestionCount(30)">30題</button>
                <button class="count-button" onclick="selectQuestionCount(40)">40題</button>
                <button class="count-button" onclick="selectQuestionCount(50)">50題</button>
            </div>
        </div>
        
        <div id="questionContainer" class="question-container" style="display: none;">
            <div class="question-header">
                <span class="question-number" id="questionNumber">題目 1 / 10</span>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="control-buttons">
                <button class="btn btn-secondary" onclick="goBackToSelection()">返回章節選擇</button>
                <button class="btn btn-secondary" onclick="previousQuestion()" id="prevButton" style="display: none;">上一題</button>
                <button class="btn btn-secondary" onclick="nextQuestion()" id="nextButton" style="display: none;">下一題</button>
                <button class="btn btn-success" onclick="submitExam()" id="submitButton" style="display: none;">完成作答</button>
            </div>
        </div>
        
        <div id="resultContainer" class="result-container" style="display: none;">
            <div class="result-score" id="resultScore"></div>
            <div class="result-text" id="resultText"></div>
            <div class="question-container" id="resultQuestions"></div>
            <div class="control-buttons">
                <button class="btn btn-primary" onclick="goBackToSelection()">返回章節選擇</button>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="exam.js"></script>
</body>
</html>
