<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史紀錄詳情 - 選擇題練習網頁</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="history.html" class="back-button">← 返回歷史紀錄</a>
        
        <div class="history-container">
            <div class="history-header" id="historyHeader">
                <div>
                    <div class="history-date" id="historyDate"></div>
                    <div style="margin-top: 5px; color: #666;">
                        章節：<span id="historyChapters"></span>
                    </div>
                </div>
                <div class="history-score" id="historyScore"></div>
            </div>
            
            <div style="margin: 20px 0;">
                <div style="margin-bottom: 15px; color: #666;">
                    總題數：<span id="totalQuestions"></span> | 
                    答對：<span id="correctCount"></span> | 
                    答錯：<span id="wrongCount"></span>
                </div>
                <div class="filter-buttons">
                    <button class="filter-button active" onclick="filterQuestions('all')">全部題目</button>
                    <button class="filter-button" onclick="filterQuestions('wrong')">只顯示答錯</button>
                </div>
            </div>
            
            <div id="questionsList"></div>
        </div>
    </div>
    
    <script src="history-detail.js"></script>
</body>
</html>
