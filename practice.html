<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>練習模式 - 選擇題練習網頁</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← 返回首頁</a>
        
        <div id="chapterSelection" class="chapter-selection">
            <h2>選擇章節（可多選）</h2>
            <div class="chapter-grid" id="chapterGrid"></div>
            <button class="btn btn-primary" onclick="startPractice()">開始練習</button>
        </div>
        
        <div id="questionContainer" class="question-container" style="display: none;">
            <div class="question-header">
                <span class="question-number" id="questionNumber">題目 1 / 10</span>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="control-buttons">
                <button class="btn btn-secondary" onclick="goBackToSelection()">返回章節選擇</button>
                <button class="btn btn-primary" onclick="nextQuestion()" id="nextButton" style="display: none;">下一題</button>
            </div>
        </div>
    </div>
    
    <script src="data.js"></script>
    <script src="practice.js"></script>
</body>
</html>
